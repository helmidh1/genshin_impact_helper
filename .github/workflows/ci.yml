name: CI

on:
  push:
    branches:
      - main
      - version_01
  pull_request:
    branches:
      - main
      - version_01

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unified checks (typecheck, lint, vitest)
        run: npm run check

      - name: Verify Next.js production build
        run: npm run build
